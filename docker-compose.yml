services:
  backend:
    build: ./backend
    environment:
      SQLITE_PATH: /app/data/dashboard.sqlite3
      DATABASE_URL: ${DATABASE_URL:-}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      APP_ORIGIN: ${APP_ORIGIN:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-2}
      GIGACHAT_CA_BUNDLE: ${GIGACHAT_CA_BUNDLE:-}
    volumes:
      - ./backend/data:/app/data
      - ./certs:/app/certs:ro
    expose:
      - "8000"
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
